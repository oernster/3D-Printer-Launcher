name: Gate

# The project's four verification commands, run by something other than
# someone remembering to. The same list is documented in DEVELOPMENT_README.md
# section 1.2; if one changes, change the other.

on:
  push:
    # Every branch, no tags: a tag push is the same commit as the branch push
    # that preceded it and would only duplicate the run.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The launcher is a Windows desktop application, so it is checked on the
    # platform it runs on. The Qt tests drive an offscreen platform plugin and
    # need no display and no system libraries here.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, plus the version development
        # actually happens on. A break at either end is worth knowing about,
        # and requirements.txt carries floors rather than pins, so what pip
        # resolves here is what a new contributor would get.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # One step per command, so a red run names which of the four failed
      # rather than making someone read the log to find out.
      - name: black
        run: python -m black --check .

      - name: flake8
        run: python -m flake8 .

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest
